<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Noël en famille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Mise en page : une colonne, onglets en haut, une fiche repliable par personne. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --ink:#15231c; --muted:#5a6b62; --line:#d9e2dd;
  --pine:#1a5a40; --pine-ink:#ffffff; --pine-soft:#dcebe3;
  --berry:#ac2b3b; --berry-soft:#f8e4e6; --gold-soft:#f6ecd0; --gold-ink:#6b5210;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101a15; --surface:#18251e; --ink:#e8f0ec; --muted:#9bb0a5; --line:#2a3b32;
    --pine:#4fae85; --pine-ink:#0c1812; --pine-soft:#1f3a2e;
    --berry:#ef7b88; --berry-soft:#3a1d22; --gold-soft:#3a3115; --gold-ink:#e8cf7e;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101a15; --surface:#18251e; --ink:#e8f0ec; --muted:#9bb0a5; --line:#2a3b32;
  --pine:#4fae85; --pine-ink:#0c1812; --pine-soft:#1f3a2e;
  --berry:#ef7b88; --berry-soft:#3a1d22; --gold-soft:#3a3115; --gold-ink:#e8cf7e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
.stripe{height:6px;background:repeating-linear-gradient(90deg,var(--berry) 0 24px,var(--pine) 24px 48px)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:16px}
h1{font:700 clamp(1.6rem,5vw,2.1rem)/1.1 var(--display);margin:0;text-wrap:balance}
h2{font:700 1.15rem/1.2 var(--display);margin:0 0 12px;text-wrap:balance}
.who{font-size:.9rem;color:var(--muted)}
.who b{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--pine);outline-offset:2px}
.link{background:none;border:0;padding:4px 2px;color:var(--pine);text-decoration:underline;font-size:.9rem}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:500;color:var(--muted);margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--berry);font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--pine)}
.btn.primary{background:var(--pine);color:var(--pine-ink);border-color:var(--pine);font-weight:700}
.btn.sm{padding:6px 10px;font-size:.88rem}
.btn[disabled]{opacity:.6;cursor:default}
.people{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.person.me{border-color:var(--pine)}
.p-head{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;background:none;border:0;padding:14px 16px}
.p-name{font:700 1.05rem var(--display)}
.tag{font:500 .72rem var(--body);background:var(--pine-soft);color:var(--pine);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.tag.kid{background:var(--gold-soft);color:var(--gold-ink)}
.p-meta{font-size:.85rem;color:var(--muted);grid-column:1}
.chev{grid-row:1 / span 2;grid-column:2;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.p-head[aria-expanded="true"] .chev{transform:rotate(-135deg)}
.bar{grid-column:1 / -1;height:6px;background:var(--pine-soft);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pine)}
.bar.over i{background:var(--berry)}
.p-body{padding:4px 16px 16px;border-top:1px solid var(--line)}
.secret{background:var(--gold-soft);color:var(--gold-ink);border-radius:8px;padding:8px 12px;font-size:.88rem;margin:12px 0}
.gift{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.gift:last-of-type{border-bottom:0}
.g-main{min-width:0;flex:1 1 200px}
.g-title{font-weight:700;overflow-wrap:anywhere}
.g-title a{color:inherit;text-decoration-color:var(--pine)}
.g-sub{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.88rem;color:var(--muted);margin-top:2px}
.g-act{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.pill{font-size:.78rem;font-weight:700;border-radius:99px;padding:2px 9px}
.pill.idle{background:var(--pine-soft);color:var(--pine)}
.pill.hold{background:var(--gold-soft);color:var(--gold-ink)}
.pill.done{background:var(--pine);color:var(--pine-ink)}
.p-actions{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:12px}
.muted{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tile small{display:block;color:var(--muted);font-size:.8rem}
.tile b{font:700 1.2rem var(--display);font-variant-numeric:tabular-nums}
.group{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 16px;margin-bottom:10px}
.group h3{font:700 1rem var(--display);margin:12px 0 0}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:24px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.8rem;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--pine-soft)}
.neg{color:var(--berry);font-weight:700}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:16px}
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,20,15,.55)}
.dialog{position:relative;background:var(--surface);width:100%;max-width:460px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:20px 16px 24px}
@media (min-width:600px){#modal{align-items:center}.dialog{border-radius:14px}}
label{display:block;font-size:.88rem;font-weight:500;margin:12px 0 4px}
input[type=text],input[type=url],input[type=password],select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
label.check{display:flex;gap:8px;align-items:center;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:20px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:12px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:90%;font-size:.9rem;z-index:30}
#toast[hidden]{display:none}
@media (max-width:440px){.tiles{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stripe"></div>
<div class="wrap">
  <header>
    <h1>Noël en famille</h1>
    <div class="who" id="who"></div>
  </header>
  <nav id="tabs" role="tablist" aria-label="Sections"></nav>
  <main id="app"><p class="muted">Chargement…</p></main>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status" hidden></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,doc,query,orderBy,onSnapshot,setDoc,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ============================================================
   À REMPLIR : colle ici la configuration de ton projet Firebase
   (voir le guide, étape 4). Garde les guillemets.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyATIefYVY6HygcZoZUHqvwAecXUoKSsDI0",
  authDomain: "noel-2026-d9c73.firebaseapp.com",
  projectId: "noel-2026-d9c73",
  storageBucket: "noel-2026-d9c73.firebasestorage.app",
  messagingSenderId: "431049250369",
  appId: "1:431049250369:web:6d718e3f7234fb880698c0"
};

/* Liste de départ : 1 = adulte, 0 = enfant. Modifiable ensuite dans la page. */
const SEED = [
  ["Maman",1],["Neveu",0],["Nièce",0],["Beau-frère",1],["Sœur",1],["Moi",1],["Fabien",1],
  ["Enfant 1 de Fabien",0],["Enfant 2 de Fabien",0],["Sœur de Fabien",1],["Père de Fabien",1],
  ["Anna Rose",1],["Louis",1],["Déa Marie",1],["Lille",1]
];

(function(){
  var $=function(s){return document.querySelector(s)};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})};
  var eur=function(n){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n||0)};
  var num=function(v){var n=parseFloat(String(v==null?'':v).replace(',','.').replace(/[^0-9.]/g,''));return isFinite(n)&&n>0?Math.round(n*100)/100:0};
  var pl=function(n,a,b){return n+' '+(n>1?b:a)};
  var sum=function(arr){return arr.reduce(function(s,g){return s+(g.price||0)},0)};

  var db=null, people=[], gifts=[], me=null, tab='cadeaux', openId=null;
  var got={p:false,g:false}, slow=false, notReady=false, dbErr='', modalKind=null, confirmFn=null, timer=null;
  try{me=localStorage.getItem('noel-me')}catch(e){}
  function setMe(id){me=id;try{localStorage.setItem('noel-me',id)}catch(e){}}
  function P(id){return people.filter(function(p){return p.id===id})[0]}
  function nameOf(id){var p=P(id);return p?p.name:'?'}
  function isAdult(p){return !!p&&p.adult!==false}
  function adults(){return people.filter(isAdult)}
  function meOk(){return isAdult(P(me))}
  function ready(){return got.p&&got.g}

  /* ---------- connexion à la base ---------- */
  function connect(){
    if(!FIREBASE_CONFIG.projectId||String(FIREBASE_CONFIG.apiKey).indexOf('COLLE')===0)return null;
    var fs=getFirestore(initializeApp(FIREBASE_CONFIG));
    return {
      collection:function(n){
        var c=collection(fs,n);
        return {
          orderBy:function(f){var q=query(c,orderBy(f));return {onSnapshot:function(a,b){return onSnapshot(q,a,b)}}},
          onSnapshot:function(a,b){return onSnapshot(c,a,b)},
          doc:function(){var r=doc(c);return {id:r.id,set:function(d){return setDoc(r,d)}}}
        };
      },
      doc:function(path){
        var r=doc(fs,path);
        return {update:function(d){return updateDoc(r,d)},set:function(d){return setDoc(r,d)},delete:function(){return deleteDoc(r)}};
      }
    };
  }

  /* ---------- rendu ---------- */
  function render(){
    var w=$('#who');
    w.innerHTML=meOk()?'Tu es <b>'+esc(nameOf(me))+'</b> <button class="link" data-act="who">changer</button>':'';
    var tabs=[['cadeaux','Cadeaux'],['achats','Mes achats'],['budget','Budget']];
    $('#tabs').innerHTML=tabs.map(function(t){return '<button role="tab" aria-selected="'+(tab===t[0])+'" data-act="tab" data-id="'+t[0]+'">'+t[1]+'</button>'}).join('');
    var app=$('#app');
    if(notReady){app.innerHTML='<div class="note"><b>La liste n\'est pas encore reliée à sa base de données.</b><p class="muted">Ouvre le fichier index.html, repère le bloc FIREBASE_CONFIG au début du script et remplace les textes COLLE_ICI par ceux de ton projet Firebase. Le guide explique où les trouver (étape 4).</p></div>';return}
    if(dbErr){app.innerHTML='<div class="note"><b>La base de données ne répond pas comme prévu.</b><p class="muted">'+esc(dbErr)+'</p></div>';return}
    if(!ready()){app.innerHTML='<p class="muted">Chargement…'+(slow?' La connexion est lente. Si rien n\'apparaît, recharge la page.':'')+'</p>';return}
    if(!people.length){app.innerHTML='<div class="note"><b>La liste est vide.</b><p class="muted">Tu peux créer la liste de la famille d\'un seul geste, puis corriger les prénoms.</p><p><button class="btn primary" data-act="seed">Créer la liste de la famille</button> <button class="btn" data-act="addPerson">Ajouter une personne</button></p></div>';return}
    app.innerHTML=(slow?'<p class="muted">Les données affichées ne sont peut-être pas à jour.</p>':'')+(tab==='cadeaux'?viewGifts():tab==='achats'?viewBuys():viewBudget());
  }

  function visibleGifts(pid){
    return gifts.filter(function(g){return g.forId===pid&&(pid!==me||g.addedBy===me)}).sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0)});
  }

  function viewGifts(){
    return '<div class="people">'+people.map(personCard).join('')+'</div><button class="btn" data-act="addPerson">Ajouter une personne</button>';
  }

  function personCard(p){
    var isMe=p.id===me, kid=!isAdult(p), open=openId===p.id, gs=visibleGifts(p.id);
    var taken=isMe?[]:gs.filter(function(g){return g.buyerId});
    var eng=sum(taken), bud=p.budget||0;
    var meta=isMe?pl(gs.length,'souhait','souhaits'):pl(gs.length,'idée','idées')+' · '+pl(taken.length,'prise','prises')+(bud>0?' · '+eur(eng)+' sur '+eur(bud):'');
    if(kid&&p.parentId&&P(p.parentId))meta='Géré par '+esc(nameOf(p.parentId))+' · '+meta;
    var bar='';
    if(!isMe&&bud>0){var pct=Math.min(100,Math.round(eng/bud*100));bar='<div class="bar'+(eng>bud?' over':'')+'"><i style="width:'+pct+'%"></i></div>'}
    var h='<section class="person'+(isMe?' me':'')+'"><button class="p-head" data-act="toggle" data-id="'+p.id+'" aria-expanded="'+open+'">'
      +'<span class="p-name">'+esc(p.name)+(isMe?'<span class="tag">toi</span>':'')+(kid?'<span class="tag kid">enfant</span>':'')+'</span><span class="chev" aria-hidden="true"></span>'
      +'<span class="p-meta">'+meta+'</span>'+bar+'</button>';
    if(open){
      h+='<div class="p-body">';
      if(isMe)h+='<p class="secret">Seuls tes propres souhaits s\'affichent ici. Ce que les autres prévoient pour toi reste secret.</p>';
      h+=gs.length?gs.map(function(g){return giftRow(g,isMe)}).join(''):'<p class="muted">Aucune idée pour le moment.</p>';
      h+='<div class="p-actions"><button class="btn primary" data-act="addGift" data-id="'+p.id+'">'+(isMe?'Ajouter un souhait':'Ajouter une idée')+'</button>'
        +'<button class="link" data-act="editPerson" data-id="'+p.id+'">Modifier '+(isMe?'mon nom':'cette personne')+'</button></div></div>';
    }
    return h+'</section>';
  }

  function giftRow(g,isMe){
    var t=/^https?:\/\//i.test(g.link||'')?'<a href="'+esc(g.link)+'" target="_blank" rel="noopener noreferrer">'+esc(g.title)+'</a>':esc(g.title);
    var badge='', btns='';
    if(!isMe){
      if(!g.buyerId){
        badge='<span class="pill idle">Disponible</span>';
        btns='<button class="btn sm" data-act="take" data-id="'+g.id+'">Je l\'offre</button>';
      }else{
        var mine=g.buyerId===me, who=mine?'toi':nameOf(g.buyerId);
        badge=g.status==='achete'?'<span class="pill done">Acheté par '+esc(who)+'</span>':'<span class="pill hold">Réservé par '+esc(who)+'</span>';
        if(mine)btns='<button class="btn sm" data-act="bought" data-id="'+g.id+'">'+(g.status==='achete'?'Pas encore acheté':'Marquer acheté')+'</button><button class="link" data-act="release" data-id="'+g.id+'">Libérer</button>';
      }
    }
    btns+='<button class="link" data-act="editGift" data-id="'+g.id+'">Modifier</button>';
    return '<div class="gift"><div class="g-main"><div class="g-title">'+t+'</div><div class="g-sub"><span>'+(g.price?eur(g.price):'Prix libre')+'</span>'+badge+'</div></div><div class="g-act">'+btns+'</div></div>';
  }

  function viewBuys(){
    var mine=gifts.filter(function(g){return g.buyerId===me&&P(g.forId)});
    if(!mine.length)return '<div class="note"><b>Tu n\'as encore rien réservé.</b><p class="muted">Dans l\'onglet Cadeaux, ouvre la fiche d\'une personne et touche « Je l\'offre » sur une idée.</p></div>';
    var done=sum(mine.filter(function(g){return g.status==='achete'})), all=sum(mine);
    var h='<div class="tiles"><div class="tile"><small>Prévu</small><b>'+eur(all)+'</b></div><div class="tile"><small>Déjà acheté</small><b>'+eur(done)+'</b></div><div class="tile"><small>Reste à acheter</small><b>'+eur(all-done)+'</b></div></div>';
    people.forEach(function(p){
      var gs=mine.filter(function(g){return g.forId===p.id});
      if(!gs.length)return;
      h+='<div class="group"><h3>Pour '+esc(p.name)+'</h3>'+gs.map(function(g){return giftRow(g,false)}).join('')+'</div>';
    });
    return h;
  }

  function viewBudget(){
    var rows='', tb=0, te=0;
    people.forEach(function(p){
      if(p.id===me){rows+='<tr><td>'+esc(p.name)+' <span class="tag">toi</span></td><td colspan="3" class="muted">Surprise</td></tr>';return}
      var eng=sum(gifts.filter(function(g){return g.forId===p.id&&g.buyerId})), bud=p.budget||0;
      tb+=bud;te+=eng;
      rows+='<tr><td>'+esc(p.name)+'</td><td>'+(bud?eur(bud):'-')+'</td><td>'+eur(eng)+'</td><td'+(bud&&eng>bud?' class="neg"':'')+'>'+(bud?eur(bud-eng):'-')+'</td></tr>';
    });
    var h='<h2>Par personne</h2><div class="tablebox"><table><thead><tr><th>Personne</th><th>Budget</th><th>Engagé</th><th>Reste</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td>Total</td><td>'+eur(tb)+'</td><td>'+eur(te)+'</td><td>'+(tb?eur(tb-te):'-')+'</td></tr></tfoot></table></div>';
    var brows='';
    adults().forEach(function(p){
      var gs=gifts.filter(function(g){return g.buyerId===p.id&&g.forId!==me});
      if(!gs.length)return;
      var done=sum(gs.filter(function(g){return g.status==='achete'}));
      brows+='<tr><td>'+esc(p.name)+'</td><td>'+pl(gs.length,'cadeau','cadeaux')+'</td><td>'+eur(sum(gs))+'</td><td>'+eur(done)+'</td></tr>';
    });
    h+='<h2>Par acheteur</h2>'+(brows?'<div class="tablebox"><table><thead><tr><th>Qui achète</th><th>Cadeaux</th><th>Prévu</th><th>Acheté</th></tr></thead><tbody>'+brows+'</tbody></table></div><p class="muted">Les cadeaux qui te sont destinés ne sont pas comptés ici.</p>':'<p class="muted">Personne n\'a encore réservé de cadeau.</p>');
    return h;
  }

  /* ---------- fenêtres ---------- */
  function showModal(kind,html,closable){
    modalKind=kind;
    var m=$('#modal');
    m.innerHTML='<div class="scrim"'+(closable?' data-act="closeModal"':'')+'></div><div class="dialog" role="dialog" aria-modal="true">'+html+'</div>';
    m.hidden=false;
    var f=m.querySelector('input:not([type=checkbox])')||m.querySelector('button');
    if(f)f.focus();
  }
  function closeModal(){var m=$('#modal');m.hidden=true;m.innerHTML='';modalKind=null;ensureMe()}
  var whoClosable=false;
  function openWho(closable){
    whoClosable=!!closable;
    showModal('who','<h2>Qui es-tu ?</h2><p class="muted">Seuls les adultes se connectent. Les enfants sont gérés par leurs parents. Ton choix reste sur cet appareil et sert à cacher les cadeaux qui te sont destinés.</p><div class="pick">'
      +adults().map(function(p){return '<button class="btn" data-act="pick" data-id="'+p.id+'">'+esc(p.name)+'</button>'}).join('')
      +'</div><p>'+(closable?'<button class="link" data-act="closeModal">Annuler</button> ':'')+'<button class="link" data-act="addPerson">Je ne suis pas dans la liste</button></p>',!!closable);
  }
  function ensureMe(){
    if(!ready()||!adults().length)return;
    if(modalKind==='who')openWho(whoClosable);
    else if(modalKind===null&&!meOk())openWho(false);
  }
  function askCode(id,pObj){
    var p=pObj||P(id); if(!p)return;
    var has=!!p.code;
    showModal('code','<h2>'+(has?'Entre ton code':'Choisis ton code')+'</h2><p class="muted">'
      +(has?'Code à 4 chiffres de '+esc(p.name)+'.':'Choisis 4 chiffres et retiens-les. Tu les retapes sur un autre appareil. Ils évitent qu\'un enfant modifie la liste à ta place.')
      +'</p><form id="cform" data-id="'+esc(id)+'" data-has="'+(has?'1':'')+'"><label for="c-code">Code à 4 chiffres</label>'
      +'<input type="password" id="c-code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off">'
      +'<div class="row"><button type="button" class="btn" data-act="who">Retour</button><button type="submit" class="btn primary">Valider</button></div></form>',false);
  }
  function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},4500)}
  function ask(text,yes,label){
    confirmFn=yes;
    showModal('confirm','<h2>Confirmer</h2><p>'+esc(text)+'</p><div class="row"><button class="btn" data-act="closeModal">Annuler</button><button class="btn primary" data-act="confirmYes">'+esc(label||'Supprimer')+'</button></div>',true);
  }
  function run(fn){
    return Promise.resolve().then(fn).then(function(){return true}).catch(function(e){
      toast(e&&e.code==='permission-denied'?'La base refuse la modification. Vérifie les règles Firestore (étape 3 du guide).':'L\'enregistrement a échoué. Réessaie dans un instant.');
      return false;
    });
  }

  function openGift(forId,gid){
    var g=gid?gifts.filter(function(x){return x.id===gid})[0]:null;
    var isMe=forId===me;
    var showMine=!isMe&&(!g||!g.buyerId||g.buyerId===me);
    showModal('gift','<h2>'+(g?'Modifier le cadeau':(isMe?'Nouveau souhait':'Nouvelle idée pour '+esc(nameOf(forId))))+'</h2>'
      +'<form id="gform" data-for="'+esc(forId)+'" data-gid="'+esc(gid||'')+'">'
      +'<label for="g-title">Cadeau</label><input type="text" id="g-title" required maxlength="120" value="'+esc(g?g.title:'')+'">'
      +'<label for="g-price">Prix estimé en euros</label><input type="text" id="g-price" inputmode="decimal" placeholder="Laisse vide si tu ne sais pas" value="'+(g&&g.price?esc(String(g.price).replace('.',',')):'')+'">'
      +'<label for="g-link">Lien vers le produit (facultatif)</label><input type="url" id="g-link" placeholder="https://" value="'+esc(g?g.link:'')+'">'
      +(showMine?'<label class="check" for="g-mine"><input type="checkbox" id="g-mine"'+(g&&g.buyerId===me?' checked':'')+'> C\'est moi qui l\'offre</label>':'')
      +'<div class="row">'+(g?'<button type="button" class="btn" data-act="delGift" data-id="'+g.id+'">Supprimer</button>':'')
      +'<button type="button" class="btn" data-act="closeModal">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></form>',true);
  }

  function openPerson(pid){
    var p=pid?P(pid):null, kid=p?!isAdult(p):false;
    var parents=adults().filter(function(a){return !p||a.id!==p.id});
    showModal('person','<h2>'+(p?'Modifier la personne':'Ajouter une personne')+'</h2>'
      +'<form id="pform" data-id="'+esc(pid||'')+'">'
      +'<label for="p-name">Prénom ou nom</label><input type="text" id="p-name" required maxlength="60" value="'+esc(p?p.name:'')+'">'
      +'<label for="p-type">Cette personne est</label><select id="p-type"><option value="adult"'+(kid?'':' selected')+'>Un adulte (se connecte avec un code)</option><option value="child"'+(kid?' selected':'')+'>Un enfant (géré par un parent)</option></select>'
      +'<div id="p-parent-box"'+(kid?'':' hidden')+'><label for="p-parent">Parent qui gère sa liste</label><select id="p-parent"><option value="">Choisir…</option>'
      +parents.map(function(a){return '<option value="'+esc(a.id)+'"'+(p&&p.parentId===a.id?' selected':'')+'>'+esc(a.name)+'</option>'}).join('')+'</select></div>'
      +'<label for="p-bud">Budget total pour cette personne, en euros (facultatif)</label><input type="text" id="p-bud" inputmode="decimal" value="'+(p&&p.budget?esc(String(p.budget).replace('.',',')):'')+'">'
      +'<div class="row">'+(p?'<button type="button" class="btn" data-act="delPerson" data-id="'+p.id+'">Supprimer</button>':'')
      +'<button type="button" class="btn" data-act="closeModal">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></form>',true);
  }

  /* ---------- actions ---------- */
  function gift(id){return gifts.filter(function(g){return g.id===id})[0]}
  document.addEventListener('change',function(e){
    if(e.target&&e.target.id==='p-type'){$('#p-parent-box').hidden=e.target.value!=='child'}
  });
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');
    if(!b)return;
    var a=b.dataset.act, id=b.dataset.id, g;
    if(a==='tab'){tab=id;render()}
    else if(a==='toggle'){openId=(openId===id?null:id);render()}
    else if(a==='who'){modalKind=null;openWho(meOk())}
    else if(a==='pick'){askCode(id)}
    else if(a==='closeModal'){closeModal()}
    else if(a==='addPerson'){modalKind=null;openPerson(null)}
    else if(a==='editPerson'){openPerson(id)}
    else if(a==='addGift'){openGift(id,null)}
    else if(a==='editGift'){g=gift(id);if(g)openGift(g.forId,id)}
    else if(a==='seed'){
      b.disabled=true;
      run(function(){
        var chain=Promise.resolve();
        SEED.forEach(function(s,i){chain=chain.then(function(){return db.collection('people').doc().set({name:s[0],adult:!!s[1],parentId:'',code:'',budget:0,order:i+1})})});
        return chain;
      });
    }
    else if(a==='take'){
      g=gift(id);if(!g)return;
      if(g.buyerId){toast('Déjà pris par '+nameOf(g.buyerId)+'.');return}
      run(function(){return db.doc('gifts/'+id).update({buyerId:me,status:'reserve'})});
    }
    else if(a==='bought'){
      g=gift(id);if(!g)return;
      run(function(){return db.doc('gifts/'+id).update({status:g.status==='achete'?'reserve':'achete'})});
    }
    else if(a==='release'){run(function(){return db.doc('gifts/'+id).update({buyerId:null,status:'idee'})})}
    else if(a==='delGift'){
      g=gift(id);if(!g)return;
      ask('Supprimer « '+g.title+' » de la liste ?',function(){
        return run(function(){return db.doc('gifts/'+id).delete()}).then(closeModal);
      });
    }
    else if(a==='delPerson'){
      var p=P(id);if(!p)return;
      ask('Supprimer '+p.name+' et tous les cadeaux qui le ou la concernent ?',function(){
        return run(function(){
          var chain=Promise.resolve();
          gifts.filter(function(x){return x.forId===id}).forEach(function(x){chain=chain.then(function(){return db.doc('gifts/'+x.id).delete()})});
          return chain.then(function(){return db.doc('people/'+id).delete()});
        }).then(function(){if(openId===id)openId=null;closeModal()});
      });
    }
    else if(a==='confirmYes'){var f=confirmFn;confirmFn=null;if(f)f()}
  });

  document.addEventListener('submit',function(e){
    e.preventDefault();
    var f=e.target, btn=f.querySelector('[type=submit]');
    if(btn)btn.disabled=true;
    if(f.id==='gform'){
      var forId=f.dataset.for, gid=f.dataset.gid, g=gid?gift(gid):null;
      var title=$('#g-title').value.trim(), price=num($('#g-price').value), link=$('#g-link').value.trim();
      if(link&&!/^https?:\/\//i.test(link))link='https://'+link;
      var mineBox=$('#g-mine'), mine=!!(mineBox&&mineBox.checked);
      if(!title){if(btn)btn.disabled=false;return}
      run(function(){
        if(g){
          var d={title:title,price:price,link:link};
          if(mineBox){
            if(mine&&g.buyerId!==me){d.buyerId=me;d.status='reserve'}
            if(!mine&&g.buyerId===me){d.buyerId=null;d.status='idee'}
          }
          return db.doc('gifts/'+g.id).update(d);
        }
        return db.collection('gifts').doc().set({forId:forId,title:title,price:price,link:link,addedBy:me,buyerId:mine?me:null,status:mine?'reserve':'idee',createdAt:Date.now()});
      }).then(function(ok){if(ok){openId=forId;closeModal();render()}else if(btn)btn.disabled=false});
    }else if(f.id==='pform'){
      var pid=f.dataset.id, nm=$('#p-name').value.trim(), bud=num($('#p-bud').value);
      var kid=$('#p-type').value==='child', parentId=kid?$('#p-parent').value:'';
      if(!nm){if(btn)btn.disabled=false;return}
      var newId=null;
      run(function(){
        if(pid)return db.doc('people/'+pid).update({name:nm,budget:bud,adult:!kid,parentId:parentId});
        var order=people.reduce(function(m,p){return Math.max(m,p.order||0)},0)+1;
        var ref=db.collection('people').doc();
        newId=ref.id;
        return ref.set({name:nm,budget:bud,adult:!kid,parentId:parentId,code:'',order:order});
      }).then(function(ok){
        if(!ok){if(btn)btn.disabled=false;return}
        if(newId&&!kid&&!meOk()){modalKind=null;askCode(newId,{id:newId,name:nm,code:''});return}
        closeModal();render();
      });
    }else if(f.id==='cform'){
      var cid=f.dataset.id, has=!!f.dataset.has, val=$('#c-code').value.trim();
      if(!/^[0-9]{4}$/.test(val)){toast('Le code doit avoir exactement 4 chiffres.');if(btn)btn.disabled=false;return}
      if(has){
        var p2=P(cid);
        if(p2&&p2.code===val){setMe(cid);closeModal();render()}
        else{toast('Code incorrect.');if(btn)btn.disabled=false}
      }else{
        run(function(){return db.doc('people/'+cid).update({code:val})}).then(function(ok){
          if(ok){setMe(cid);closeModal();render()}else if(btn)btn.disabled=false;
        });
      }
    }
  });

  /* ---------- données en direct ---------- */
  function onSnap(snap){
    if(!snap.metadata.fromCache){clearTimeout(timer);slow=false}
  }
  function fail(e){
    clearTimeout(timer);
    dbErr=(e&&e.code==='permission-denied')?'La base refuse la lecture. Publie les règles du fichier firestore.rules (étape 3 du guide).':'Vérifie ta connexion, puis recharge la page. Si le problème continue, revois la configuration Firebase (étape 4 du guide).';
    render();
  }
  function start(){
    render();
    try{db=connect()}catch(e){db=null;dbErr='La configuration Firebase est invalide. Recopie-la depuis la console, étape 4 du guide.'}
    if(!db){if(!dbErr)notReady=true;render();return}
    timer=setTimeout(function(){slow=true;render()},10000);
    db.collection('people').orderBy('order').onSnapshot(function(snap){
      people=snap.docs.map(function(d){var x=d.data();x.id=d.id;return x});
      got.p=true;onSnap(snap);render();ensureMe();
    },fail);
    db.collection('gifts').onSnapshot(function(snap){
      gifts=snap.docs.map(function(d){var x=d.data();x.id=d.id;return x});
      got.g=true;onSnap(snap);render();
    },fail);
  }
  start();
})();
</script>
</body>
</html>
